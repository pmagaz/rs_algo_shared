[package]
name = "rs_algo_shared"
version = "0.1.1"
authors = ["pmagaz <magazpablo@gmail.com>"]
edition = "2024"

[lib]
name = "rs_algo_shared"
path = "src/lib.rs"

[features]
default = []
chart = ["plotters"]
oanda = ["futures-util", "tokio"]
darwinex = ["tokio-tungstenite", "futures-util", "tokio"]
xtb = ["tungstenite", "tokio-tungstenite", "futures-util", "tokio"]
websocket = ["tungstenite", "tokio", "futures-util"]

[dependencies]
async-trait = "0.1.83"
dyn-clone = "1.0.17"
anyhow = "1.0.98"
thiserror = "2.0"
dotenv = "0.15.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_qs = "0.12.0"
bson = { version = "2.13", features = ["chrono-0_4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
chrono = { version = "0.4.40", features = ["serde"] }
round = "0.1.2"
env_logger = "0.11"
log = "0.4"
regex = "1.11"

[dependencies.plotters]
optional = true
git = "https://github.com/pmagaz/plotters"
branch = "master"
features = ["all_series"]

[dependencies.futures-util]
optional = true
version = "0.3.31"
default-features = false
features = ["std"]

[dependencies.tungstenite]
optional = true
version = "0.24"
features = ["rustls-tls-native-roots"]

[dependencies.tokio-tungstenite]
optional = true
version = "0.24"
features = ["rustls-tls-native-roots"]

[dependencies.tokio]
optional = true
version = "1.44"
features = ["rt-multi-thread", "macros"]

[dependencies.find_peaks]
optional = false
version = "0.1.5"

[dependencies.polyfit-rs]
optional = false
version = "0.2.0"

[dependencies.ta]
optional = false
git = "https://github.com/pmagaz/ta-rs"
branch = "master"
features = ["serde"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
lto = true
